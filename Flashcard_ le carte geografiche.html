<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcard: le carte geografiche</title>
<!--
=====================================================================
COME PERSONALIZZARE QUESTO FILE
1. Cerca "IMPOSTAZIONI": cambia titolo e sottotitolo.
2. Cerca "CATEGORIE": cambia nomi e colori delle sezioni.
3. Cerca "CARTE": ogni flashcard è un blocco { cat, q, a, art }.
   - cat: sigla della categoria (vedi CATEGORIE)
   - q:   domanda (fronte)
   - a:   risposta (retro). Puoi usare <b>parola</b> per evidenziare.
   - art: nome di un disegno già pronto (vedi ART) oppure una emoji
   - img: (facoltativo) indirizzo di una tua immagine o foto, es. "foto/monti.jpg".
          Se lo scrivi, sostituisce il disegno. Tieni la foto nella stessa cartella del file.
4. Per aggiungere una carta copia un blocco e cambia i testi. Per toglierla cancellalo.
=====================================================================
-->
<style>
:root{
  --carta:#fff8e7;
  --inchiostro:#24344d;
  --mare:#2ba3d9;
  --sole:#ffc93c;
  --prato:#5cb85c;
  --roccia:#8a5a2b;
  --corallo:#ff6b6b;
  --viola:#8e6bd8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:"Trebuchet MS","Verdana",system-ui,sans-serif;
  color:var(--inchiostro);
  background:
    radial-gradient(circle at 12% 18%, #ffe9a8 0 90px, transparent 91px),
    radial-gradient(circle at 92% 82%, #bfe8ff 0 130px, transparent 131px),
    var(--carta);
  background-attachment:fixed;
  padding:14px 14px 40px;
}
.wrap{max-width:760px;margin:0 auto}
header{text-align:center;margin:6px 0 10px}
h1{font-size:clamp(26px,6vw,40px);margin:0;letter-spacing:.5px;color:var(--roccia)}
.sub{margin:4px 0 0;font-size:clamp(15px,3.6vw,18px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 10px}
.chip{
  border:3px solid var(--c);background:#fff;color:var(--inchiostro);
  border-radius:999px;padding:7px 14px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--c);color:#fff}
.chip:focus-visible,.btn:focus-visible,.card:focus-visible{outline:4px solid var(--viola);outline-offset:3px}
.bar{display:flex;align-items:center;gap:10px;margin:10px 4px}
.track{flex:1;height:16px;border-radius:99px;background:#fff;border:3px solid var(--inchiostro);overflow:hidden}
.fill{height:100%;width:0;background:var(--prato);transition:width .35s}
.count{font-weight:700;white-space:nowrap}
.scene{perspective:1400px;margin:10px 0}
.card{
  position:relative;width:100%;height:min(66vh,520px);min-height:430px;
  cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.8,.3,1);
  border-radius:28px;
}
.card.flip{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:28px;border:5px solid var(--cc);background:#fff;
  box-shadow:0 8px 0 var(--cc);
  display:flex;flex-direction:column;align-items:center;padding:16px 18px;overflow:hidden;
}
.back{transform:rotateY(180deg);background:#fffdf3}
.tag{
  align-self:flex-start;background:var(--cc);color:#fff;font-weight:700;font-size:14px;
  padding:4px 12px;border-radius:99px;
}
.art{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;margin:6px 0}
.art svg,.art img{max-height:100%;max-width:100%;width:auto;height:100%}
.art img{object-fit:contain;border-radius:16px}
.art .emoji{font-size:clamp(70px,22vw,130px);line-height:1}
.q{font-size:clamp(21px,5vw,28px);font-weight:800;text-align:center;margin:0 0 6px;line-height:1.25}
.hint{font-size:14px;opacity:.65;margin-top:6px}
.back .art{flex:0 0 auto;height:110px;margin:2px 0 6px}
.ans{
  font-size:clamp(18px,4.3vw,22px);line-height:1.5;text-align:left;width:100%;
  overflow:auto;flex:1;padding:4px 6px;
}
.ans b{background:linear-gradient(transparent 55%, #ffe27a 55%);padding:0 2px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btn{
  border:none;border-radius:18px;padding:13px 20px;font:inherit;font-weight:800;font-size:17px;
  color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.nav{background:var(--mare)}
.ok{background:var(--prato)}
.again{background:var(--corallo)}
.mix{background:var(--viola)}
.sw{background:var(--roccia)}
.btn[hidden]{display:none}
.status{text-align:center;min-height:26px;font-weight:700;margin-top:12px}
.end{text-align:center;padding:30px 10px;font-size:22px;font-weight:800}
@media (prefers-reduced-motion:reduce){.card,.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titolo"></h1>
    <p class="sub" id="sottotitolo"></p>
  </header>

  <div class="chips" id="chips" role="group" aria-label="Scegli l'argomento"></div>

  <div class="bar">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="count" id="count"></div>
  </div>

  <div class="scene" id="scene"></div>

  <div class="controls">
    <button class="btn nav" id="prev" aria-label="Carta precedente">← Indietro</button>
    <button class="btn nav" id="flip">Gira la carta</button>
    <button class="btn nav" id="next" aria-label="Carta successiva">Avanti →</button>
  </div>
  <div class="controls">
    <button class="btn again" id="again" hidden>Da ripassare</button>
    <button class="btn ok" id="know" hidden>Lo so!</button>
  </div>
  <div class="controls">
    <button class="btn mix" id="mix">Mescola</button>
    <button class="btn sw" id="mode">Parti dalla risposta: no</button>
    <button class="btn nav" id="reset">Ricomincia</button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
</div>

  const rad = d => (d - 90) * Math.PI / 180;

  const x2 = cx + r*Math.cos(rad(a)),  y2 = cy + r*Math.sin(rad(a));
  const grande = (a - da) > 180 ? 1 : 0;
  return `<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${grande} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${colore}" stroke="#fff" stroke-width="2"/>`;
}

/* =====================  FINE DELLA PARTE DA MODIFICARE  ===================== */

const $ = (id) => document.getElementById(id);
const tutte = CARTE.map((c, i) => ({ ...c, id: i }));
let filtro = "tutte";
let mazzo = [];
let pos = 0;
const conosciute = new Set();
const daRipassare = new Set();
let partiRisposta = false;

$("titolo").textContent = IMPOSTAZIONI.titolo;
$("sottotitolo").textContent = IMPOSTAZIONI.sottotitolo;
document.title = IMPOSTAZIONI.titolo;

function disegno(c){
  if (c.img) return `<img src="${c.img}" alt="">`;
  if (c.art && ART[c.art]) return ART[c.art];
  if (c.art) return `<div class="emoji">${c.art}</div>`;
  return `<div class="emoji">🗺️</div>`;
}

function costruisciChips(){
  const box = $("chips");
  box.innerHTML = "";
  const voci = [["tutte", {nome:"Tutte", colore:"#24344d"}], ...Object.entries(CATEGORIE)];
  voci.forEach(([k, v]) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.style.setProperty("--c", v.colore);
    b.textContent = v.nome;
    b.setAttribute("aria-pressed", String(k === filtro));
    b.onclick = () => { filtro = k; costruisciChips(); costruisciMazzo(); };
    box.appendChild(b);
  });
}

function costruisciMazzo(rimescola){
  mazzo = tutte.filter(c => filtro === "tutte" || c.cat === filtro);
  if (rimescola){
    for (let i = mazzo.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [mazzo[i], mazzo[j]] = [mazzo[j], mazzo[i]];
    }
  }
  pos = 0;
  mostra();
}

function mostra(){
  const scena = $("scene");
  if (!mazzo.length){
    scena.innerHTML = `<div class="end">Nessuna carta in questa sezione.</div>`;
    $("count").textContent = ""; aggiornaBottoni(); return;
  }
  const c = mazzo[pos];
  const cat = CATEGORIE[c.cat] || { nome: c.cat, colore: "#2ba3d9" };
  scena.innerHTML = `
    <div class="card" id="card" tabindex="0" role="button" aria-label="Gira la carta" style="--cc:${cat.colore}">
      <div class="face front">
        <span class="tag">${cat.nome}</span>
        <div class="art">${disegno(c)}</div>
        <p class="q">${c.q}</p>
        <span class="hint">Tocca la carta per vedere la risposta</span>
      </div>
      <div class="face back">
        <span class="tag">${cat.nome}</span>
        <div class="art">${disegno(c)}</div>
        <div class="ans">${c.a}</div>
      </div>
    </div>`;
  const card = $("card");
  card.onclick = girare;
  card.onkeydown = (e) => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); girare(); } };
  if (partiRisposta) card.classList.add("flip");
  aggiorna();
}

function girare(){
  const card = $("card");
  if (card) card.classList.toggle("flip");
  aggiornaBottoni();
}

function aggiornaBottoni(){
  const card = $("card");
  const retro = !!card && card.classList.contains("flip");
  $("know").hidden = !retro;
  $("again").hidden = !retro;
}

function aggiorna(){
  const tot = mazzo.length;
  const fatte = mazzo.filter(c => conosciute.has(c.id)).length;
  const rip = mazzo.filter(c => daRipassare.has(c.id)).length;
  $("count").textContent = tot ? `Carta ${pos + 1} di ${tot}` : "";
  $("fill").style.width = tot ? (fatte / tot * 100) + "%" : "0";
  $("status").textContent = tot ? `Le so: ${fatte} · Da ripassare: ${rip}` : "";
  aggiornaBottoni();
}

function vai(d){
  if (!mazzo.length) return;
  pos = (pos + d + mazzo.length) % mazzo.length;
  mostra();
}

$("next").onclick = () => vai(1);
$("prev").onclick = () => vai(-1);
$("flip").onclick = girare;
$("mix").onclick = () => costruisciMazzo(true);
$("mode").onclick = () => {
  partiRisposta = !partiRisposta;
  $("mode").textContent = "Parti dalla risposta: " + (partiRisposta ? "sì" : "no");
  mostra();
};
$("reset").onclick = () => { conosciute.clear(); daRipassare.clear(); costruisciMazzo(); };
$("know").onclick = () => {
  const c = mazzo[pos];
  conosciute.add(c.id); daRipassare.delete(c.id);
  if (mazzo.every(x => conosciute.has(x.id))){
    $("scene").innerHTML = `<div class="end">🎉 Bravo! Hai imparato tutte le carte di questa sezione!</div>`;
    aggiorna();
  } else vai(1);
};
$("again").onclick = () => {
  const c = mazzo[pos];
  daRipassare.add(c.id); conosciute.delete(c.id); vai(1);
};
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") vai(1);
  if (e.key === "ArrowLeft") vai(-1);
});

costruisciChips();
costruisciMazzo();
</script>
